      <p class="post-meta"><time datetime="2026-10-04T23:55:00">2026-10-04 23:55</time><span class="dot">·</span><span class="tag-list"><a class="tag" href="tags/linux.html">linux</a><a class="tag" href="tags/nodejs.html">nodejs</a></span></p>
      </header>
      <div class="post-content">
<p>最近在使用 dsh 准备安装插件的时候，发现插件的安装刚需<code>pnpm</code>，我用 pacman 安装了之后运行安装命令后又发现出现了权限相关的错误。问过 AI 后，发现问题出在 pacman 安装了 pnpm 后，所有用户的全局包存储的文件权限都被 root 用户所持有。</p>
<p>最后的解决方案是使用<code>chown</code>命令将权限重新分配给当前用户。</p>

      </div>
